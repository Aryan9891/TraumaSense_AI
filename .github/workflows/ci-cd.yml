name: TraumaSense AI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test-suite:
    name: Backend Audio/DSP & API Test Suite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install System Audio & DSP Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Database Tables & Multi-Tier Seed Data
        env:
          USE_LOCAL_SQLITE: "True"
          SQLITE_URL: "sqlite:///./traumasense_local.db"
          PYTHONPATH: "."
        run: |
          python -m app.init_db
          python -m app.seed

      - name: Run Pytest Regression Suite
        env:
          USE_LOCAL_SQLITE: "True"
          SQLITE_URL: "sqlite:///./traumasense_local.db"
          PYTHONPATH: "."
        run: |
          python -m pytest tests -v

  frontend-production-build:
    name: Frontend Next.js 15 Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_cmVsYXRpdmUtbGlvbmVzcy00ODYwLmNsZXJrLmFjY291bnRzLmRldiQ"
          NEXT_PUBLIC_SUPABASE_URL: "https://dummy-supabase-project.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-supabase-anon-key-placeholder"
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
